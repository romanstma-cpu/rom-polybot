name: Build Installers

# Builds the Windows and Apple Silicon installers from the same commit, each
# on its own runner, and tests the packaged backend before anything ships.
#
# A push to `build` (or `main`) publishes each installer as an asset on a
# per-run GitHub *prerelease*; release assets do not count against Actions
# artifact storage and do not expire. Any other run — a pull request that
# changes the pipeline or what gets packaged, or a manual dispatch — keeps the
# installers as workflow artifacts for a week and publishes nothing, so such a
# change can be tested before it is trusted. This workflow does not wire up
# auto-update.
#
# To release: Actions → Build Installers → Run workflow, on master, with the
# version from package.json typed into "Release version". That builds both
# installers and, once both pass, creates the v<version> tag on the commit it
# built and publishes the release. Pushing a v<version> tag does the same.
#
# The Windows installer used to be built by hand on a personal machine. Built
# here, both platforms come from a tagged, reproducible run, which is also what
# SignPath requires before it will sign anything.
on:
  push:
    branches: [main, build]
    # A version tag (v2.36.0) builds both installers and publishes them
    # together as that version's release: see the release job at the end.
    tags: ['v*']
  # A pull request that changes this file, the dependencies, or the backend
  # bundle runs it as a dry run: both installers are built and tested,
  # nothing is published. (electron-builder's config lives in package.json.)
  pull_request:
    paths:
      - ".github/workflows/build-installers.yml"
      - "package.json"
      - "package-lock.json"
      - "python/requirements*.txt"
      - "python/*.spec"
      - "scripts/build-python.mjs"
  workflow_dispatch:
    inputs:
      release:
        description: >-
          Release version: type the version in package.json (for example
          2.37.0) to tag master and publish it. Leave empty for a test build
          that publishes nothing.
        required: false
        type: string
        default: ""

# contents: write is required to create the release and upload installer assets.
permissions:
  contents: write

env:
  # Branch pushes publish per-run CI prereleases. Version tags publish one
  # versioned release from the release job instead.
  PUBLISH: ${{ github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  mac:
    name: mac-apple-silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Production release gate
        run: npm run release:gate

      - name: Build app, bundle backend, package installer
        shell: bash
        run: |
          npm run py:dist
          npx electron-builder --mac dmg --arm64
        env:
          # Build the macOS app unsigned — no Apple Developer cert/secrets needed.
          # electron-builder ad-hoc signs arm64 so it still launches (right-click
          # > Open the first time). No-op on Linux/Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged backend and installer
        shell: bash
        run: |
          APP=$(find release -maxdepth 3 -name 'ROM PolyBot.app' -type d | head -1)
          test -n "$APP"
          "$APP/Contents/Resources/python/rom-polybot-backend" --selftest
          node scripts/mac-smoke.mjs "$APP/Contents/MacOS/ROM PolyBot"
          if compgen -G "release/*.dmg" > /dev/null; then
            hdiutil verify release/*.dmg
          fi
          FILE=$(find release -maxdepth 1 -name '*-arm64.dmg' -type f | head -1)
          test -n "$FILE"
          # Same format as Windows and the site's checksum files: upper-case
          # hash, two spaces, and the name GitHub gives the asset.
          HASH=$(shasum -a 256 "$FILE" | cut -d' ' -f1 | tr a-f A-F)
          echo "$HASH  $(basename "$FILE" | tr ' ' '.')" > release/SHA256SUMS-mac-apple-silicon.txt
          cat release/SHA256SUMS-mac-apple-silicon.txt

      - name: Publish installer to a GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: polybot-mac-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: CI build ${{ github.run_number }} (${{ github.sha }})
          prerelease: true
          make_latest: false
          body: >
            Unsigned Apple Silicon installer built from ${{ github.sha }}.
            macOS may require right-click → Open the first time; the arm64 app
            is ad-hoc signed but is not Apple-notarized.
          files: |
            release/*-arm64.dmg
            release/SHA256SUMS-mac-apple-silicon.txt

      - name: Keep the installer (not published)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rom-polybot-mac-apple-silicon
          path: |
            release/*-arm64.dmg
            release/SHA256SUMS-mac-apple-silicon.txt
          retention-days: 7

  windows:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      # On Windows the gate also runs the Electron UI audit.
      - name: Production release gate
        run: npm run release:gate

      - name: Build app, bundle backend, package installer
        shell: bash
        run: |
          npm run py:dist
          npx electron-builder --win nsis --x64

      - name: Verify packaged backend and installer
        shell: bash
        run: |
          release/win-unpacked/resources/python/rom-polybot-backend.exe --selftest
          FILE=$(find release -maxdepth 1 -name '*-Setup-*.exe' -type f | head -1)
          test -n "$FILE"
          # Same format as the site's SHA256SUMS files: upper-case hash, two
          # spaces, and the name GitHub gives the asset (spaces become dots).
          HASH=$(sha256sum "$FILE" | cut -d' ' -f1 | tr a-f A-F)
          echo "$HASH  $(basename "$FILE" | tr ' ' '.')" > release/SHA256SUMS-windows-x64.txt
          cat release/SHA256SUMS-windows-x64.txt

      - name: Publish installer to a GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: polybot-win-ci-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: CI build ${{ github.run_number }} Windows (${{ github.sha }})
          prerelease: true
          make_latest: false
          body: >
            Unsigned Windows 10/11 x64 installer built from ${{ github.sha }}.
            Windows may show an unknown-publisher warning; verify the file
            against the SHA-256 published beside it.
          files: |
            release/*-Setup-*.exe
            release/SHA256SUMS-windows-x64.txt

      - name: Keep the installer (not published)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rom-polybot-windows-x64
          path: |
            release/*-Setup-*.exe
            release/SHA256SUMS-windows-x64.txt
          retention-days: 7

  # A version tag, or a manual run with a release version, publishes both
  # installers as one release, only after both platforms built, passed the
  # gate and self-tested, and only when the version matches package.json and
  # has release notes. A manual release must run on master and the version
  # must not be released yet; the tag is created on the commit that was built.
  # A pull request that changes this pipeline runs every step here except
  # publishing.
  release:
    name: publish-release
    if: >-
      startsWith(github.ref, 'refs/tags/v') || github.event_name == 'pull_request'
      || (github.event_name == 'workflow_dispatch' && inputs.release != '')
    needs: [mac, windows]
    runs-on: ubuntu-latest
    # Two manual releases at once would race for the same tag.
    concurrency:
      group: publish-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag, version and release notes agree
        id: version
        shell: bash
        env:
          REQUESTED: ${{ inputs.release }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PUBLISH_RELEASE=false
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "${GITHUB_REF_NAME}" = "v${VERSION}" || {
              echo "Tag ${GITHUB_REF_NAME} does not match package.json ${VERSION}"; exit 1; }
            PUBLISH_RELEASE=true
          elif [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            REQUESTED=$(printf %s "${REQUESTED}" | tr -d "[:space:]"); REQUESTED="${REQUESTED#v}"
            test "${GITHUB_REF}" = "refs/heads/master" || {
              echo "Releases are made from master, not ${GITHUB_REF_NAME}"; exit 1; }
            test "${REQUESTED}" = "${VERSION}" || {
              echo "Release version ${REQUESTED} does not match package.json ${VERSION}"; exit 1; }
            if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null; then
              echo "v${VERSION} is already released; bump the version in package.json first"; exit 1
            fi
            PUBLISH_RELEASE=true
          fi
          test -s "docs/release-notes/release-notes-${VERSION}.md" || {
            echo "docs/release-notes/release-notes-${VERSION}.md is missing"; exit 1; }
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "publish=${PUBLISH_RELEASE}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v7
        with:
          path: dist-release
          merge-multiple: true

      - name: Rename to the published names and verify both checksums
        shell: bash
        working-directory: dist-release
        run: |
          # The checksum files name the assets as GitHub will (spaces become
          # dots), so rename first and check the files against them.
          for f in *\ *; do [ -e "$f" ] && mv "$f" "$(echo "$f" | tr ' ' '.')"; done
          ls -l
          for sums in SHA256SUMS-windows-x64.txt SHA256SUMS-mac-apple-silicon.txt; do
            test -s "$sums"
            while read -r hash name; do
              actual=$(sha256sum "$name" | cut -d' ' -f1 | tr a-f A-F)
              test "$actual" = "$hash" || { echo "$name does not match $sums"; exit 1; }
            done < "$sums"
          done
          test -f "ROM.PolyBot-Setup-${{ steps.version.outputs.version }}.exe"
          test -f "ROM.PolyBot-${{ steps.version.outputs.version }}-arm64.dmg"

      # On a manual release the tag does not exist yet, so it is created here
      # at the commit both installers were built from. A tag made with this
      # workflow's token does not start another run.
      - name: Publish the release
        if: steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ROM PolyBot ${{ steps.version.outputs.version }}
          body_path: docs/release-notes/release-notes-${{ steps.version.outputs.version }}.md
          prerelease: false
          make_latest: true
          files: |
            dist-release/ROM.PolyBot-Setup-${{ steps.version.outputs.version }}.exe
            dist-release/ROM.PolyBot-${{ steps.version.outputs.version }}-arm64.dmg
            dist-release/SHA256SUMS-windows-x64.txt
            dist-release/SHA256SUMS-mac-apple-silicon.txt
