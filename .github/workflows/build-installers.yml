name: Build Installers

# Builds the Windows and Apple Silicon installers from the same commit, each
# on its own runner, and tests the packaged backend before anything ships.
#
# A push to `build` (or `main`) publishes each installer as an asset on a
# per-run GitHub *prerelease*; release assets do not count against Actions
# artifact storage and do not expire. Any other run — a pull request that
# touches this file, or a manual dispatch — keeps the installers as workflow artifacts for a week
# and publishes nothing, so a change to this pipeline can be tested before it
# is trusted. This workflow does not wire up auto-update.
#
# The Windows installer used to be built by hand on a personal machine. Built
# here, both platforms come from a tagged, reproducible run, which is also what
# SignPath requires before it will sign anything.
on:
  push:
    branches: [main, build]
  # A pull request that changes this file runs it as a dry run: both
  # installers are built and tested, nothing is published.
  pull_request:
    paths: [".github/workflows/build-installers.yml"]
  workflow_dispatch: {}

# contents: write is required to create the release and upload installer assets.
permissions:
  contents: write

env:
  PUBLISH: ${{ github.event_name == 'push' }}

jobs:
  mac:
    name: mac-apple-silicon
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Production release gate
        run: npm run release:gate

      - name: Build app, bundle backend, package installer
        shell: bash
        run: |
          npm run py:dist
          npx electron-builder --mac dmg --arm64
        env:
          # Build the macOS app unsigned — no Apple Developer cert/secrets needed.
          # electron-builder ad-hoc signs arm64 so it still launches (right-click
          # > Open the first time). No-op on Linux/Windows.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Verify packaged backend and installer
        shell: bash
        run: |
          APP=$(find release -maxdepth 3 -name 'ROM PolyBot.app' -type d | head -1)
          test -n "$APP"
          "$APP/Contents/Resources/python/rom-polybot-backend" --selftest
          node scripts/mac-smoke.mjs "$APP/Contents/MacOS/ROM PolyBot"
          if compgen -G "release/*.dmg" > /dev/null; then
            hdiutil verify release/*.dmg
          fi
          FILE=$(find release -maxdepth 1 -name '*-arm64.dmg' -type f | head -1)
          test -n "$FILE"
          shasum -a 256 "$FILE" > release/SHA256SUMS-mac-apple-silicon.txt

      - name: Publish installer to a GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: polybot-mac-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: CI build ${{ github.run_number }} (${{ github.sha }})
          prerelease: true
          make_latest: false
          body: >
            Unsigned Apple Silicon installer built from ${{ github.sha }}.
            macOS may require right-click → Open the first time; the arm64 app
            is ad-hoc signed but is not Apple-notarized.
          files: |
            release/*-arm64.dmg
            release/SHA256SUMS-mac-apple-silicon.txt

      - name: Keep the installer (not published)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rom-polybot-mac-apple-silicon
          path: |
            release/*-arm64.dmg
            release/SHA256SUMS-mac-apple-silicon.txt
          retention-days: 7

  windows:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      # On Windows the gate also runs the Electron UI audit.
      - name: Production release gate
        run: npm run release:gate

      - name: Build app, bundle backend, package installer
        shell: bash
        run: |
          npm run py:dist
          npx electron-builder --win nsis --x64

      - name: Verify packaged backend and installer
        shell: bash
        run: |
          release/win-unpacked/resources/python/rom-polybot-backend.exe --selftest
          FILE=$(find release -maxdepth 1 -name '*-Setup-*.exe' -type f | head -1)
          test -n "$FILE"
          # Same format as the site's SHA256SUMS files: upper-case hash, two
          # spaces, and the name GitHub gives the asset (spaces become dots).
          HASH=$(sha256sum "$FILE" | cut -d' ' -f1 | tr a-f A-F)
          echo "$HASH  $(basename "$FILE" | tr ' ' '.')" > release/SHA256SUMS-windows-x64.txt
          cat release/SHA256SUMS-windows-x64.txt

      - name: Publish installer to a GitHub Release
        if: env.PUBLISH == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: polybot-win-ci-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: CI build ${{ github.run_number }} Windows (${{ github.sha }})
          prerelease: true
          make_latest: false
          body: >
            Unsigned Windows 10/11 x64 installer built from ${{ github.sha }}.
            Windows may show an unknown-publisher warning; verify the file
            against the SHA-256 published beside it.
          files: |
            release/*-Setup-*.exe
            release/SHA256SUMS-windows-x64.txt

      - name: Keep the installer (not published)
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: rom-polybot-windows-x64
          path: |
            release/*-Setup-*.exe
            release/SHA256SUMS-windows-x64.txt
          retention-days: 7
