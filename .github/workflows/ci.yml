name: CI

# The release gate on every pull request and every push to master. While the
# source lived in the website repository this workflow listened for `main`,
# which there was the website, so it never ran at all.

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so a test that depends on today's date fails here first rather
  # than in the middle of a release. One did: it pinned 2026-08-01 and broke
  # once the recorder's 60-day retention window moved past it.
  schedule:
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Node dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: pip install -r python/requirements-dev.txt

      - name: Production release gate
        run: npm run release:gate
